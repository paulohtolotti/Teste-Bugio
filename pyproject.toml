[project]
name = "teste-bugio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paulohtolotti", email = "paulohtolotti@alumni.usp.br" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
teste-bugio = "teste_bugio:main"



[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
exclude = [".venv", "alembic/**"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["E", "F", "C901"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 160
