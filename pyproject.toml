[project]
name = "teste-bugio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paulohtolotti", email = "paulohtolotti@alumni.usp.br" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
teste-bugio = "teste_bugio:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
